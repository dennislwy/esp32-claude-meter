; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Waveshare ESP32-S3-ePaper-1.54 uses ESP32-S3-PICO-1-N8R8: 8MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
; Sound effects in data/ go to the 1.5 MB file system partition: pio run -t uploadfs
board_build.filesystem = littlefs
; Root CAs for verifying api.anthropic.com, extracted from Mozilla's list (curl.se/ca/cacert.pem)
board_build.embed_txtfiles = assets/certs/anthropic_roots.pem
; Route Serial to the native USB-Serial/JTAG port (COM5) instead of UART0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
lib_deps = lvgl/lvgl@9.3.0